[package]
name = "marginal-tauri"
version = "0.1.0"
description = "Marginal 桌面壳（web 前端的薄壳，spec §2）"
edition = "2021"

[lib]
name = "marginal_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
