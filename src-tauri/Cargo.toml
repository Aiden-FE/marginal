[package]
name = "marginal-tauri"
version = "0.1.0"
description = "Marginal 桌面壳（web 前端的薄壳，spec §2）"
edition = "2021"

# 注意：本机无 Rust 工具链（cargo/rustc 未安装），此脚手架尚未编译验证。
# 安装 Rust 后：cargo install tauri-cli && cargo tauri dev

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
